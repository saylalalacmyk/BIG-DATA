/* ---------- every object "gets hurt" at its real ER rate: it shivers (no plasters) ---------- */
const YEAR = 365 * 24 * 3600;
function shake(el) { if (!el) return; el.classList.remove('ouch'); void el.offsetWidth; el.classList.add('ouch'); }
function hurt(id) {
  if (!cur) shake(OBJ_EL[id]);

/* ---------- the waiting room: real 2025 ER notes arriving at the real national pace ---------- */
const FEED_MS = 365 * 24 * 3600 * 1000 / FEED.perYear;        // ≈ 4.9 s between home ER visits in the US
let ROW = 115, TOP = 130, fOn = false, fRows = [], fScale = 1, fI = 0, fH = 982;
const fOrder = FEED.notes.map((_, i) => i).filter(i => FEED.notes[i].x.length <= 120).sort(() => Math.random() - .5);
const nextNote = () => FEED.notes[fOrder[fI++ % fOrder.length]];
// one clock for the whole site: every arrival is one person, one dot and one note
const arrivals = []; let fNext = performance.now() - Math.log(1 - Math.random()) * FEED_MS;
setInterval(() => {
  const now = performance.now();
  while (now >= fNext) { const a = { t: fNext, n: nextNote() }; arrivals.push(a); fNext += -Math.log(1 - Math.random()) * FEED_MS; if (fOn) arrive(a); }
}, 200);
$('fBack').addEventListener('click', () => { location.hash = ''; });

const ago = t => { const s = Math.max(0, Math.round((performance.now() - t) / 1000)); return s < 5 ? 'Now' : s < 60 ? `${s} Sec Ago` : `${Math.floor(s / 60)} Min Ago`; };
function fRowHTML(a) {

}
function addRow(a, instant) {
  const el = document.createElement('div'); el.className = 'fr' + (instant ? '' : ' first'); el.innerHTML = fRowHTML(a);
  el.addEventListener('pointerenter', () => { if (a.dot) a.dot.hot = true; el.classList.add('hot'); });
  el.addEventListener('pointerleave', () => { if (a.dot) a.dot.hot = false; el.classList.remove('hot'); });
  $('fList').appendChild(el); const row = { el, a }; fRows.unshift(row);
  fRows.forEach((r, i) => { if (i) r.el.classList.remove('first'); });
  const st = el.querySelector('.st'), x = clean(a.n.x);
  if (instant) { el.style.transition = 'none'; st.textContent = x; }
  else {

    const ty = setInterval(() => {                       // typed like a nurse at a keyboard

}
function arrive(a) { addDot(a, true); addRow(a, false); }

/* dots: one dot per person since the site opened; they drift like a crowd in a waiting room; hover one to read its note */
const cv = $('fDots'), cx = cv.getContext('2d'), dots = []; let DW = 309, DH = 387, fHot = null;
function addDot(a, falling) {
  const d = { x: DW / 2 + (Math.random() - .5) * 60, y: falling ? -14 : 30 + Math.random() * (DH - 60), vx: (Math.random() - .5) * .6, vy: falling ? 1.6 : 0, born: falling ? performance.now() : -1e9, a };
  a.dot = d; dots.push(d); if (dots.length > 600) { const old = dots.shift(); old.a.dot = null; }
}
function stepDots() {

  const r = Math.max(3.5, 12 * Math.sqrt(30 / Math.max(30, dots.length))), now = performance.now(), D = r * 2.1;
  for (const d of dots) {
    d.vx += (Math.random() - .5) * .12 + (DW / 2 - d.x) * .00015; d.vy += (Math.random() - .5) * .12 + (DH / 2 - d.y) * .00015;
    d.vx *= .97; d.vy *= .97; d.x += d.vx; d.y += d.vy;
    if (d.x < r) { d.x = r; d.vx = Math.abs(d.vx); } if (d.x > DW - r) { d.x = DW - r; d.vx = -Math.abs(d.vx); }
    if (d.y > DH - r - 14) { d.y = DH - r - 14; d.vy = -Math.abs(d.vy) * .6; } if (d.y < r && now - d.born > 1500) { d.y = r; d.vy = Math.abs(d.vy); }
  }
  for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++) {
    const a = dots[i], b = dots[j], dx = b.x - a.x, dy = b.y - a.y, dd = dx * dx + dy * dy;
    if (dd < D * D && dd > .01) { const dist = Math.sqrt(dd), p = (D - dist) / dist * .25; a.x -= dx * p; a.y -= dy * p; b.x += dx * p; b.y += dy * p; }

  cx.setTransform(k, 0, 0, k, 0, 0); cx.clearRect(0, 0, DW, DH);

let dotR = 12;
cv.addEventListener('pointermove', e => {
  const b = cv.getBoundingClientRect(), px = (e.clientX - b.left) / fScale, py = (e.clientY - b.top) / fScale;
  let best = null, bd = 1e9; for (const d of dots) { const dd = Math.hypot(d.x - px, d.y - py); if (dd < bd) { bd = dd; best = d; } }
  fHot = bd < dotR + 5 ? best : null; const tip = $('oTip');

function fLoop() {
  if (!fOn) return;
  drawCount(String(arrivals.length).padStart(2, '0'));
  dotR = stepDots();
  fRows = fRows.filter((r, i) => {              // rows slide down and simply fade out at the bottom
    r.el.querySelector('.dt').textContent = ago(r.a.t);
    if (TOP + i * ROW > fH + 40) { r.el.remove(); return false; } return true;
  });
  requestAnimationFrame(fLoop);

let lastCount = '';
function drawCount(s) {   // each digit is its own NewEdge outline, set side by side with -7% spacing like the design
  if (s === lastCount) return; lastCount = s;
  const F0 = parseFloat($('fCount').dataset.f || 250), maxW = F0 === 250 ? 330 : 400;
  const wU = [...s].reduce((w, c) => w + OUT.dg[c].adv, 0);
  const F = Math.min(F0, maxW / (wU / 1000)), k = F / 1000, top = OUT.dg['0'].top * k;
  let x = -OUT.dg[s[0]].x0, h = '';
  [...s].forEach(c => { const g = OUT.dg[c]; h += `<path d="${g.d}" transform="translate(${x * k},${top}) scale(${k},${-k})"/>`; x += g.adv; });
  $('fCountG').innerHTML = h;
  const H0 = OUT.dg['0'].top * F0 / 1000;
  $('fCount').style.marginTop = (H0 - top) + 'px';
  $('fCount').setAttribute('width', (x + 160) * k); $('fCount').setAttribute('height', top + 10);
}
function startFeed() {
  fOn = true; layoutFeed();
  $('fList').innerHTML = ''; fRows = []; dots.length = 0;
  // the people who arrived while you were on other pages are already sitting in the waiting room
  arrivals.slice(-600).forEach(a => addDot(a, false));
  const rows = Math.ceil((fH - TOP) / ROW) + 1;
  let pre = arrivals.slice(-rows); const t0 = pre.length ? pre[0].t : performance.now();
  let tb = t0; while (pre.length < rows) { tb -= FEED_MS * (0.6 + Math.random() * 0.9); const a = { t: tb, n: nextNote() }; pre.unshift(a); addDot(a, false); }
  pre.forEach(a => addRow(a, true));

}
function stopFeed() { fOn = false; }
function layoutFeed() {
  const vw = window.innerWidth, vh = window.innerHeight, F = $('fFrame'), wide = vw >= 900 && vw / vh > 1.05;
  F.classList.toggle('ph', !wide);
  const set = (id, o) => Object.assign($(id).style, o);
  ['fDots', 'fCount', 'fCountL'].forEach(i => $(i).removeAttribute('style')); $('fBack').setAttribute('style', 'left:50px;top:26px');
  if (wide) {
    fScale = Math.min(vw / 1512, vh / 982); const W = vw / fScale, H = vh / fScale; fH = H;
    ROW = 115; TOP = 174;
    F.style.width = W + 'px'; F.style.height = H + 'px'; F.style.transform = `scale(${fScale})`; F.style.setProperty('--W', W + 'px');
    $('fCount').dataset.f = 250;
  } else {   // phone: counter + dots on top, notes underneath
    fScale = vw / 820; const H = vh / fScale; fH = H; ROW = 150; TOP = 470;
    F.style.width = '820px'; F.style.height = H + 'px'; F.style.transform = `scale(${fScale})`; F.style.setProperty('--W', '820px');
    set('fBack', { left: '24px', top: '26px' }); set('fCount', { left: '24px', top: '74px' }); $('fCount').dataset.f = 190;
    set('fCountL', { left: '24px', top: '240px', fontSize: '24px', lineHeight: '26px', width: '380px' });
    set('fDots', { left: '420px', top: '36px', width: '376px', height: '360px' });

function fitLabel() {   // shrink the caption under the number until it sits on two lines
  const el = $('fCountL'); let f = parseFloat(el.style.fontSize) || 30;
  for (f = (oL && 0) || (fFrameIsPh() ? 26 : 30); f > 14; f -= 1) { el.style.fontSize = f + 'px'; el.style.lineHeight = Math.round(f * 1.05) + 'px'; if (el.offsetHeight <= Math.round(f * 1.05) * 2 + 2) break; }
}

/* ---------- ambulance: its siren takes the colour of the page; it drives by after a few quiet seconds ---------- */
function sirenColour() { const h = location.hash.slice(1); return BY[h] ? BY[h].bg : h === 'now' ? '#ff4545' : '#ED1C24'; }
let idleT = 0;
function poke() { clearTimeout(idleT); idleT = setTimeout(idleDrive, 9000); }

poke();

/* ---------- custom cursor: a red dot that inverts what is under it ---------- */
const CLICKY = '.obj,[role=button],#pPill,#pPrev,#aNext,#aPrev,.agePill,.row,#bodyBtn';
addEventListener('pointermove', e => {

/* ---------- routing ---------- */
OBJS.forEach(o => { const i = new Image(); i.src = `img/${o.img}.webp`; });   // preload every picture
let first = true;
function route() {
  if (first) { first = false; return show(); }
  const views = [$('home'), $('obj'), $('age'), $('feed')];
  const g = $('grain'); g.classList.add('on');
  const amb = $('amb'); amb.classList.remove('go', 'idle'); void amb.getBoundingClientRect(); amb.classList.add('go');
  setTimeout(() => $('ambStar').setAttribute('fill', sirenColour()), 0);
  views.forEach(v => v.classList.add('out'));

    views.forEach(v => { v.classList.remove('out'); v.classList.add('pre'); });
